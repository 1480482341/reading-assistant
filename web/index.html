<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Reading Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
  (function () {
    var t = localStorage.getItem("ra-theme");
    if (["eye-green","dark","light","eye-warm"].indexOf(t) < 0) t = "eye-green";
    document.documentElement.dataset.theme = t;
  })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Reading&nbsp;Assistant</div>
    <nav>
      <a href="/" class="active">阅读</a>
      <a href="/library">文章库</a>
      <a href="/review">复习</a>
      <a href="/api/export?format=md">导出</a>
      <button id="theme-toggle" class="theme-toggle">护眼绿</button>
    </nav>
  </header>

  <div class="banner" id="banner" hidden>
    本机 claude 不可用：划词只记录、不做即时分析，预分析暂停。阅读与复习不受影响。
  </div>

  <main class="layout">
    <aside class="actions">
      <div class="actions-ops">
        <div class="side-head">书签</div>
        <button id="add-bookmark">＋ 书签</button>
        <ul id="bookmark-list"></ul>
        <div class="side-head">标色</div>
        <div class="swatches">
          <button class="swatch" data-color="red" title="标红"></button>
          <button class="swatch" data-color="green" title="标绿"></button>
          <button class="swatch" data-color="yellow" title="标黄"></button>
        </div>
        <div class="side-head">操作</div>
        <button id="shelf-toggle">加入书架</button>
        <button id="mark-read">读完了</button>
      </div>
    </aside>
    <section class="reader">
      <h1 id="article-title">载入中…</h1>
      <div class="title-zh" id="article-title-zh" hidden></div>
      <div class="meta" id="article-meta"></div>
      <article id="article-body"></article>
    </section>

    <aside class="sidebar" id="sidebar">
      <div class="side-head">本篇已标记</div>
      <ul id="marked-list"></ul>
      <div class="side-head">语法点</div>
      <ul id="grammar-list"></ul>
    </aside>
  </main>

  <div class="popup" id="popup" hidden>
    <div class="popup-term" id="popup-term"></div>
    <div class="popup-gloss" id="popup-gloss"></div>
    <div class="popup-why" id="popup-why"></div>
    <div class="popup-actions">
      <button id="popup-save">记下来</button>
      <button id="popup-close" class="ghost">关闭</button>
    </div>
  </div>

  <div class="popup" id="hl-popup" hidden>
    <div class="popup-term">标色</div>
    <div class="popup-actions">
      <button class="swatch" data-color="red" title="标红"></button>
      <button class="swatch" data-color="green" title="标绿"></button>
      <button class="swatch" data-color="yellow" title="标黄"></button>
      <button id="hl-remove" class="ghost">取消标色</button>
    </div>
  </div>

  <script src="/static/theme.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>文章库 · Reading Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/library.css">
  <script>
  (function () {
    var t = localStorage.getItem("ra-theme");
    if (["eye-green","dark","light","eye-warm"].indexOf(t) < 0) t = "eye-green";
    document.documentElement.dataset.theme = t;
  })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Reading&nbsp;Assistant</div>
    <nav>
      <a href="/">阅读</a>
      <a href="/library" class="active">文章库</a>
      <a href="/review">复习</a>
      <a href="/api/export?format=md">导出</a>
      <button id="theme-toggle" class="theme-toggle">护眼绿</button>
    </nav>
  </header>

  <main class="library-wrap">
    <h1>文章库</h1>
    <div class="filters">
      <div class="status-filter" id="status-filter">
        <button data-status="all">全部</button>
        <button data-status="pending">待分析</button>
        <button data-status="ready">可读</button>
        <button data-status="read">已读</button>
      </div>
      <div class="tag-filter" id="tag-filter"></div>
    </div>
    <ul class="article-list" id="article-list"></ul>
    <p class="empty" id="empty-state" hidden>没有匹配的文章。</p>
  </main>

  <script src="/static/theme.js"></script>
  <script src="/static/library.js"></script>
</body>
</html>

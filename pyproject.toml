[project]
name = "reading-assistant"
version = "0.1.0"
description = "Local English reading assistant with lookup and review"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
]

[tool.mypy]
ignore_missing_imports = true
files = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
